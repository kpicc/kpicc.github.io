<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
    <title>Okta User Test</title>
    <style>
      img[src*="/okta/freedom-logo"] {
        width: auto !important;
        height: 40px !important;
      }

      @media (max-width: 767px) {
        img[src*="/okta/freedom-logo"] {
          height: 32px !important;
        }
      }

      .proto-header {
        background: #ffffff;
        border-bottom: 1px solid #dedede;
        padding: 12px 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-family: 'Ambra', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      }
      .proto-header a {
        color: #000000;
        text-decoration: none;
        font-size: 14px;
        font-weight: 500;
      }
      .proto-header a:hover { text-decoration: underline; }
      .proto-view-toggle {
        display: inline-flex;
        border: 1px solid #dedede;
        border-radius: 999px;
        overflow: hidden;
      }
      .proto-view-toggle button {
        border: none;
        background: #ffffff;
        color: #000000;
        font: inherit;
        font-size: 14px;
        padding: 4px 16px;
        cursor: pointer;
      }
      .proto-view-toggle button.active {
        background: #012f4c;
        color: #ffffff;
      }
      .proto-device {
        display: none;
        margin: 32px auto;
        width: 390px;
        height: 844px;
        border: 12px solid #1e1e1e;
        border-radius: 44px;
        overflow: hidden;
        position: relative;
        background: #ffffff;
        box-shadow: 0 24px 48px rgba(0, 0, 0, 0.18);
      }
      .proto-device::before {
        content: '';
        position: absolute;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 140px;
        height: 26px;
        background: #1e1e1e;
        border-radius: 0 0 16px 16px;
        z-index: 2;
      }
      .proto-device iframe {
        width: 100%;
        height: calc(100% - 32px);
        margin-top: 32px;
        border: none;
      }
      body.proto-mobile #root { display: none; }
      body.proto-mobile .proto-device { display: block; }
      body.proto-frame .proto-header { display: none; }

      .proto-header-actions { display: flex; align-items: center; gap: 20px; }
      .proto-reset {
        border: none; background: none; padding: 0; cursor: pointer;
        color: #156ba3; font-family: 'Ambra Sans Text', 'Helvetica Neue', Helvetica, Arial, sans-serif;
        font-size: 14px; font-weight: 500;
      }
      .proto-reset:hover { color: #0f4f7a; text-decoration: underline; }
      .proto-reset--below { display: none; }

      /* phone: concept intro + scaled interactive frame (not the live site) */
      .proto-intro { display: none; }
      @media (max-width: 460px) {
        body.proto-concept { background: #f4f4f6; }
        body.proto-concept .proto-view-toggle { display: none; }
        body.proto-concept #root { display: none; }
        body.proto-concept .proto-main { padding: 20px 16px 32px; display: flex; flex-direction: column; gap: 20px; }
        body.proto-concept .proto-intro {
          display: flex; flex-direction: column; gap: 8px;
          font-family: 'Ambra Sans Text', 'Helvetica Neue', Helvetica, Arial, sans-serif;
        }
        .proto-tag {
          align-self: flex-start; font-size: 12px; letter-spacing: 1.2px; text-transform: uppercase;
          color: #db5c05; border: 1px solid #db5c05; border-radius: 999px; padding: 3px 10px;
        }
        .proto-intro h1 { margin: 0; font-size: 24px; line-height: 28px; font-weight: 500; color: #191919; }
        .proto-intro p { margin: 0; font-size: 14px; line-height: 20px; color: #666; }
        body.proto-concept .proto-fit { width: calc(390px * var(--fit, 1)); height: calc(844px * var(--fit, 1)); }
        body.proto-concept .proto-header .proto-reset { display: none; }
        body.proto-concept .proto-reset--below { display: block; align-self: center; font-size: 16px; }
        body.proto-concept .proto-device {
          display: block; margin: 0; box-sizing: border-box;
          transform: scale(var(--fit, 1)); transform-origin: top left;
        }
      }
    </style>
    <script type="module" crossorigin src="/mobile-app/okta/assets/index-DsyKe9Nv.js"></script>
    <link rel="stylesheet" crossorigin href="/mobile-app/okta/assets/index-COKD45mf.css">
  </head>
  <body>
    <header class="proto-header">
      <a href="/">&larr; Back to projects</a>
      <div class="proto-header-actions">
      <button type="button" class="proto-reset" onclick="resetProto()">Reset prototype</button>
      <div class="proto-view-toggle">
        <button type="button" data-view="desktop" class="active">Desktop</button>
        <button type="button" data-view="mobile">Mobile</button>
      </div>
      </div>
    </header>
    <div class="proto-main">
      <div class="proto-intro">
        <span class="proto-tag">Concept prototype</span>
        <h1>FM Login Migration (Okta)</h1>
        <p>A user-testing prototype of the Okta sign-in migration: mobile login, verification, MFA setup, PIN reset and account linking. This is a design prototype, not the live Freedom sign-in.</p>
      </div>
      <div id="root"></div>
      <div class="proto-fit"><div class="proto-device"><iframe title="Mobile preview"></iframe></div></div>
      <button type="button" class="proto-reset proto-reset--below" onclick="resetProto()">Reset prototype</button>
    </div>
    <script>
      function resetProto() {
        Object.keys(sessionStorage).forEach(function (k) {
          if (k.indexOf('okta') === 0) sessionStorage.removeItem(k);
        });
        localStorage.removeItem('oktaPasswordResetEmail');
        if (document.body.classList.contains('proto-mobile')) sessionStorage.setItem('protoView', 'mobile');
        location.replace(location.origin + location.pathname);
      }
      (function () {
        if (new URLSearchParams(location.search).has('frame')) {
          document.body.classList.add('proto-frame');
          return;
        }
        var buttons = document.querySelectorAll('.proto-view-toggle button');
        var iframe = document.querySelector('.proto-device iframe');
        var phone = matchMedia('(max-width: 460px)');
        function frameSrc() {
          if (!iframe.src) iframe.src = location.origin + location.pathname + '?frame=1';
        }
        function fitPhone() {
          document.body.classList.toggle('proto-concept', phone.matches);
          if (!phone.matches) return;
          frameSrc();
          var w = document.documentElement.clientWidth - 32;
          document.documentElement.style.setProperty('--fit', Math.min(1, w / 390));
        }
        fitPhone();
        addEventListener('resize', fitPhone);
        if (sessionStorage.getItem('protoView') === 'mobile') {
          sessionStorage.removeItem('protoView');
          var mb = document.querySelector('.proto-view-toggle [data-view="mobile"]');
          setTimeout(function () { mb.click(); });
        }
        buttons.forEach(function (btn) {
          btn.addEventListener('click', function () {
            var mobile = btn.dataset.view === 'mobile';
            document.body.classList.toggle('proto-mobile', mobile);
            if (mobile) frameSrc();
            buttons.forEach(function (b) { b.classList.toggle('active', b === btn); });
          });
        });
      })();
    </script>
  </body>
</html>
