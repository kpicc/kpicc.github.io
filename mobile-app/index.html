<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mobile App — Katrina's Projects</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #f4f4f6;
        min-height: 100vh;
      }
      .proto-header {
        background: #fff;
        border-bottom: 1px solid #e5e5e5;
        padding: 14px 24px;
      }
      .proto-header a {
        color: #111;
        text-decoration: none;
        font-size: 14px;
        font-weight: 500;
      }
      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 40px 16px 64px;
      }
      h1 {
        font-size: 20px;
        font-weight: 600;
        margin-bottom: 8px;
      }
      .sub {
        color: #666;
        font-size: 14px;
        margin-bottom: 32px;
        text-align: center;
      }
      .device {
        width: 390px;
        height: 844px;
        background: #111;
        border-radius: 44px;
        padding: 12px;
        box-shadow: 0 24px 48px rgba(0,0,0,.18);
        position: relative;
      }
      .device::before {
        content: '';
        position: absolute;
        top: 22px;
        left: 50%;
        transform: translateX(-50%);
        width: 110px;
        height: 26px;
        background: #111;
        border-radius: 16px;
        z-index: 2;
      }
      .screen {
        width: 100%;
        height: 100%;
        border-radius: 34px;
        overflow: hidden;
        background: #fff;
        display: flex;
        flex-direction: column;
      }
      .screen .scroll {
        flex: 1;
        overflow-y: auto;
        scrollbar-width: thin;
      }
      .screen .nav {
        flex-shrink: 0;
        border-top: 1px solid #e5e5e5;
      }
      .screen img {
        display: block;
        width: 100%;
        height: auto;
      }
      @media (max-width: 460px) {
        .device { width: 100%; height: 80vh; }
      }
    </style>
  </head>
  <body>
    <header class="proto-header">
      <a href="/">&larr; Back to projects</a>
    </header>
    <main>
      <h1>Mobile App</h1>
      <p class="sub">Freedom My Account app — home screen (scroll inside the device)</p>
      <div class="device">
        <div class="screen">
          <div class="scroll">
            <img src="content.png" alt="Freedom Mobile app home screen" />
          </div>
          <img class="nav" src="nav.png" alt="" />
        </div>
      </div>
    </main>
  </body>
</html>
